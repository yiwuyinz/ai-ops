global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Deliberately down target -> DemoAppDown alert fires, great for testing the pipeline.
  # Replace with your real services later.
  - job_name: demo-app
    static_configs:
      - targets: ["host.docker.internal:9999"]
